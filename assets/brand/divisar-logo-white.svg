<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 76" width="260" height="76">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .brand-title {
        font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 0.14em;
        fill: #FAF7F2;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', 'Montserrat', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.42em;
        fill: #EAE4D9;
      }
      .accent-line {
        stroke: #C5A059;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      .accent-leaf {
        fill: #D4AF37;
      }
    </style>
  </defs>
  <!-- Main Brand Title -->
  <text x="130" y="38" text-anchor="middle" class="brand-title">DIVISAR</text>
  <!-- Ornamental lines flanking STORE -->
  <line x1="22" y1="58" x2="72" y2="58" class="accent-line" />
  <circle cx="78" cy="58" r="1.8" class="accent-leaf" />
  <text x="130" y="62" text-anchor="middle" class="brand-sub">STORE</text>
  <circle cx="182" cy="58" r="1.8" class="accent-leaf" />
  <line x1="188" y1="58" x2="238" y2="58" class="accent-line" />
</svg>
